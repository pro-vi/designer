name: probe-heartbeat

# Dead-man's-switch for the daily-health probe.
#
# The daily-health job runs on a SELF-HOSTED Mac mini runner. If that box is down
# (asleep, or awaiting a FileVault login after a power outage) or its runner is
# offline — or GitHub has auto-deleted the runner registration for a runner that
# has not connected recently (which happened: dead since 2026-08-01, silently,
# with this heartbeat green the whole time) — the probe simply never fires.
# This workflow runs on a GitHub-HOSTED runner — independent of the Mac mini —
# and FAILS (which emails the repo owner via the default Actions failure
# notification) when the probe has stopped SUCCEEDING.
#
# Four failure modes, each checked directly:
#   never   — no daily-health runs (or no successful runs) exist at all
#   queued  — the latest run has sat queued >6h: no runner picked it up
#             (runner offline, deregistered, or its labels no longer match)
#   broken  — the latest COMPLETED run concluded non-success: the probe
#             ENVIRONMENT is broken (debug Chrome down / Node < 22 / canary
#             project gone), NOT claude.ai UI drift
#   stale   — no run has concluded success within 32h (24h daily cadence +
#             observed GitHub cron jitter of up to ~6h + grace): catches every
#             other mode, including queued-run chains that never execute
#             (observed here 2026-08-02..09-14: runs cancelled ~30h after
#             creation while no runner was registered — mechanism unverified)
#
# What it does NOT alert on: real claude.ai UI/selector drift. That leaves the
# daily-health job green (the probe step is continue-on-error) and opens a
# selectors-drift PR instead — a separate, intentional signal.

on:
  schedule:
    - cron: '0 16 * * *' # 16:00 UTC — 2h after daily-health's 14:00 cron, so it has finished
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: probe-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: alert if the daily-health probe went stale or broke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the daily-health probe is still succeeding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          QUEUED_MAX_AGE_HOURS: '6' # pickup is instant when a runner is online; 6h = never legitimately queued this long
          SUCCESS_MAX_AGE_HOURS: '32' # daily cadence (24h) + observed GitHub cron jitter (~6h) + grace
        run: |
          set -euo pipefail

          latest=$(gh run list --repo "$REPO" --workflow=daily-health.yml --limit 1 \
            --json createdAt,status,conclusion,url)
          if [ "$(echo "$latest" | jq 'length')" -eq 0 ]; then
            echo "::error::No daily-health runs found at all — the probe has never run."
            exit 1
          fi
          l_status=$(echo "$latest" | jq -r '.[0].status')
          l_conclusion=$(echo "$latest" | jq -r '.[0].conclusion')
          l_created=$(echo "$latest" | jq -r '.[0].createdAt')
          l_url=$(echo "$latest" | jq -r '.[0].url')
          l_age_h=$(( ( $(date -u +%s) - $(date -u -d "$l_created" +%s) ) / 3600 ))
          echo "latest daily-health: status=$l_status conclusion=$l_conclusion age=${l_age_h}h"
          echo "  $l_url"

          fail=0

          # queued: the latest run has been waiting for a runner too long.
          if [ "$l_status" = "queued" ] && [ "$l_age_h" -gt "$QUEUED_MAX_AGE_HOURS" ]; then
            echo "::error::daily-health has been QUEUED for ${l_age_h}h (> ${QUEUED_MAX_AGE_HOURS}h) — no runner picked it up: the self-hosted Mac mini runner is offline, deregistered (GitHub auto-deletes registrations that stay disconnected), or its labels no longer match [self-hosted, macOS, designer-health]."
            fail=1
          fi

          # broken: the latest run that COMPLETED did not succeed.
          if [ "$l_status" = "completed" ] && [ "$l_conclusion" != "success" ]; then
            echo "::error::latest daily-health run concluded '$l_conclusion' — the probe ENVIRONMENT is broken (debug Chrome down / Node < 22 / canary project gone), NOT claude.ai UI drift. See: $l_url"
            fail=1
          fi

          # stale + never: alert on the age of the last SUCCESS, not the age of
          # the latest run — a fresh queued run is created daily even when
          # nothing can execute it, so latest-run age never grows in a dead
          # system. This is the check that stays true when all others are
          # dodged.
          last_success=$(gh run list --repo "$REPO" --workflow=daily-health.yml --status success --limit 1 \
            --json createdAt,url)
          if [ "$(echo "$last_success" | jq 'length')" -eq 0 ]; then
            echo "::error::daily-health has NEVER concluded success — the probe has never actually worked."
            exit 1
          fi
          s_created=$(echo "$last_success" | jq -r '.[0].createdAt')
          s_url=$(echo "$last_success" | jq -r '.[0].url')
          s_age_h=$(( ( $(date -u +%s) - $(date -u -d "$s_created" +%s) ) / 3600 ))
          echo "last success: ${s_age_h}h ago"
          echo "  $s_url"
          if [ "$s_age_h" -gt "$SUCCESS_MAX_AGE_HOURS" ]; then
            echo "::error::daily-health last succeeded ${s_age_h}h ago (> ${SUCCESS_MAX_AGE_HOURS}h) — successes have stopped: cancelled/queued run chains (runner gone), hangs, or repeated failures. Last green: $s_url"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "heartbeat ok — latest run ${l_age_h}h old (${l_status}/${l_conclusion}), last success ${s_age_h}h ago."
