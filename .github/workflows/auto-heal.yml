name: auto-heal

# Fires after daily-health concludes. On failure, downloads the failing
# probe's artifact, runs `scripts/auto-heal.ts triage` to pick a single
# anchor with streak >= 2 (and not in 7-day cooldown), then `heal` it via
# LLM inference + local re-probe. If green after patch, opens a PR for
# human review. Auto-heal PRs are NEVER auto-merged — that's an explicit
# constraint from issue #17.

on:
  workflow_run:
    workflows: ["daily-health"]
    types: [completed]
    # Only respond to daily-health runs on the default branch. This job
    # has write permissions + secrets and checks out + executes the
    # triggering SHA on a self-hosted runner — without this filter, a
    # manual workflow_dispatch of daily-health on any feature branch
    # would let that branch's code run with elevated privileges.
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for actions/download-artifact@v8 to fetch artifacts from a
  # different workflow run (the triggering daily-health run).
  actions: read

# Serialize auto-heal runs. Two daily-health completions firing close
# together (cron + manual workflow_dispatch) would otherwise queue two
# auto-heal jobs that race the self-hosted runner's workspace (shared
# checkout dir) and streak.json. cancel-in-progress: false so a queued
# run waits rather than killing an in-flight heal mid-patch.
concurrency:
  group: auto-heal
  cancel-in-progress: false

jobs:
  heal:
    # Defense-in-depth alongside the `branches: [main]` trigger filter:
    # also gate the job on the triggering run's branch. workflow_run only
    # ever fires from the default-branch workflow definition, but this
    # makes the "never run untrusted-branch code with our secrets"
    # invariant explicit at the job level too.
    if: github.event.workflow_run.head_branch == 'main'
    # Fire on every daily-health completion regardless of conclusion.
    # daily-health.yml marks the probe step `continue-on-error: true`, so
    # the workflow's roll-up conclusion is `success` even when the probe
    # fails — gating on `workflow_run.conclusion` here would never see a
    # probe failure. `auto-heal.ts triage` reads the artifact and the
    # streak file to decide; on green days it emits `action=skip` and the
    # heal step is skipped via the per-step `if` below. Cost: ~30s of
    # runner time on green days for triage + artifact download.
    name: propose ui-anchor patch on probe failure
    # Self-hosted so we can re-run the probe against the live CDP Chrome
    # (same runner that ran daily-health). Datacenter runners can't reach
    # the signed-in Chrome profile.
    runs-on: [self-hosted, macOS, designer-health]
    timeout-minutes: 20

    steps:
      - name: Checkout at triggering SHA
        uses: actions/checkout@v7
        with:
          # Run against the exact commit daily-health probed. If main has
          # advanced since, the probe artifact reflects the old code and
          # the patch needs to land on the same base — peter-evans will
          # rebase as needed when opening the PR.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup gh PATH
        # The self-hosted Mac mini runner has gh at /opt/homebrew/bin/gh
        # (Homebrew), but the workflow's non-interactive bash doesn't inherit
        # that PATH from ~/.zshrc — it only gets nvm's node bin. Prepend
        # Homebrew's bin to $GITHUB_PATH so every subsequent step (including
        # the npm-spawned auto-heal script's gh() helper) can find gh.
        # Without this, `Ensure labels exist` + the script's cooldown /
        # wholesale-redesign / findDriftPrNumber checks silently no-op.
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Ensure labels exist (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create auto-heal \
            --color B7E4C7 \
            --description "LLM-proposed selector recovery from daily-health drift" \
            2>/dev/null || true
          gh label create wholesale-redesign-suspected \
            --color FFB4A2 \
            --description ">=5 anchors regressed at once — needs human triage" \
            2>/dev/null || true
          gh label create auto-heal-blind \
            --color D00000 \
            --description "Anchors are failing but none are auto-patchable — auto-heal cannot fix these" \
            2>/dev/null || true

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download health artifact from triggering run
        # Cross-workflow artifact download. `run-id` + `github-token` are
        # what differentiates this from a same-run download.
        uses: actions/download-artifact@v8
        with:
          name: health-${{ github.event.workflow_run.id }}
          path: artifacts/health/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Triage candidate anchor
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run -s auto-heal -- triage

      - name: Heal selected anchor
        id: heal
        if: steps.triage.outputs.action == 'heal'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Either credential is sufficient — auto-heal.ts prefers OAuth when
          # both are set. ANTHROPIC_API_KEY is per-token metered billing;
          # CLAUDE_CODE_OAUTH_TOKEN is Claude Pro/Max subscription quota
          # (installed by the official Claude Code GitHub App, see #20).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Re-probe needs the same canary the original run probed — verifying a
          # patch against a different project proves nothing. This mirrors
          # daily-health.yml's value, and `npm run preflight` now ASSERTS the two
          # agree: they had drifted to two different (both deleted) projects
          # while the comment claimed they were kept in sync by convention.
          DESIGNER_PROBE_PROJECT_URL: https://claude.ai/design/p/9a2066ca-e9e4-4972-a294-560092e6a216
          # Pipe the triage output through env (not `${{ }}` substitution into
          # the shell command body) so an anchor-id with unexpected characters
          # cannot inject. auto-heal.ts also re-validates the id via
          # isValidAnchorId() before doing anything with it.
          ANCHOR_ID: ${{ steps.triage.outputs.anchor-id }}
        run: npm run -s auto-heal -- heal "$ANCHOR_ID"

      - name: Open auto-heal PR
        if: steps.heal.outputs.patched == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: health/auto-heal-${{ steps.heal.outputs.anchor-id }}-${{ steps.heal.outputs.date }}
          base: main
          # Both patch targets. The selector lives in ui-anchors.ts only for
          # anchors with an inline literal; every anchor that reads SEL.* is
          # repaired in selectors.json instead (patcher V2, #129 item 0.3).
          #
          # Listing both is safe for a narrower reason than "the other one gets
          # reverted" — it does not. Every revertPatch() call site is on a
          # failure path, and this step runs only when patched == 'true'. The
          # real guarantee is that heal() WRITES exactly one of the two, so the
          # other is untouched and create-pull-request has nothing to commit for
          # it. If a future change ever dirties both, this list would commit
          # both under a message naming one anchor.
          add-paths: |
            ui-anchors.ts
            selectors.json
          commit-message: |
            chore(selectors): auto-heal ${{ steps.heal.outputs.anchor-id }} in ${{ steps.heal.outputs.patched-file }}

            Replaces selector for ${{ steps.heal.outputs.anchor-id }} from
            `${{ steps.heal.outputs.old-selector }}` to `${{ steps.heal.outputs.new-selector }}`.
            LLM confidence: ${{ steps.heal.outputs.confidence }}. Re-probe green.
          title: "chore(ui-anchors): auto-heal ${{ steps.heal.outputs.anchor-id }}"
          labels: |
            auto-heal
          body: |
            ## Auto-heal proposal

            - **Anchor**: `${{ steps.heal.outputs.anchor-id }}`
            - **Patched**: `${{ steps.heal.outputs.patched-file }}`${{ steps.heal.outputs.selectors-key != '' && format(' at `{0}`', steps.heal.outputs.selectors-key) || '' }}
            - **Before**: `${{ steps.heal.outputs.old-selector }}`
            - **After**: `${{ steps.heal.outputs.new-selector }}`
            - **Confidence**: ${{ steps.heal.outputs.confidence }}
            - **Local re-probe**: patched anchor `ok` (not merely non-failing), and no anchor that was working beforehand regressed or went inconclusive
            ${{ steps.heal.outputs.same-key-anchors != '' && format('- **Other anchors reading this key**: {0} — these are what the non-regression check could actually catch', steps.heal.outputs.same-key-anchors) || '- **Other anchors reading this key**: none. No other anchor reads this key, so the non-regression check could only have caught *second-order* breakage (an anchor that uses the element rather than just asserting it is present). Treat the reader list below as the primary review signal, not the re-probe.' }}
            ${{ steps.heal.outputs.key-consumers != '' && format('- **This key is also read by**: {0} — best-effort textual scan, it under-reports keys reached through a passed-down object', steps.heal.outputs.key-consumers) || '' }}
            ${{ steps.heal.outputs.superseded-selector != '' && format('- **Superseded value NOT demoted**: `{0}` was replaced and is now gone. selectors.json''s contract is that a superseded canonical selector moves into `{1}` so a rolled-back page reports `degraded` instead of `fail`. auto-heal will not write two keys in one unverified patch — **please demote it by hand before merging.**', steps.heal.outputs.superseded-selector, steps.heal.outputs.legacy-key) || '' }}
            - **Originating drift PR**: ${{ steps.heal.outputs.drift-pr-number != '' && format('#{0}', steps.heal.outputs.drift-pr-number) || '(none found)' }}
            - **Triggered by run**: [daily-health #${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})

            ### LLM rationale

            > ${{ steps.heal.outputs.rationale }}

            ---

            **Human review required.** This PR is NOT auto-merged. Verify the
            new selector matches the intended element before merging — auto-
            heal validates that the *anchor probes green* and that nothing else
            broke, not that the selector targets the *right* DOM node. A
            presence check is satisfied by the wrong element too.

            **Read a `selectors.json` patch with more care than a `ui-anchors.ts`
            one.** That file is the contract `createSession`, `listProjects`,
            `deleteFile` and the sign-in verifier all resolve against, so this
            change alters the tool's behaviour, not just what the daily probe
            looks for.

            **Do not read the non-regression check as verification.** It can only
            see what some *other* anchor asserts. Measured against today's
            registry, the 10 patchable anchors map to 10 distinct keys — no key
            is read by two anchors — so for most patches its first-order coverage
            is zero and its only reach is second-order (an anchor that *uses* the
            element rather than asserting its presence). The reader list above is
            the signal that actually tells you what this change moves.

      # Unconditional restore. Every revertPatch() call site lives inside the
      # heal process, so a SIGKILL from the 20-minute job ceiling — plausible:
      # the re-probe alone allows 5 min, the Anthropic call ~3 min, plus npm ci
      # and snapshot capture — skips all of them and leaves a patched
      # selectors.json on the SHARED self-hosted runner. actions/checkout cleans
      # on the next run, so the exposure window is up to 24h, during which any
      # human on that machine has designer verbs resolving against an unreviewed
      # selector. Runs after the PR step, which has already committed what it
      # needed.
      - name: Restore working tree
        if: always()
        run: |
          git -C "$GITHUB_WORKSPACE" checkout -- ui-anchors.ts selectors.json || true
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet HEAD -- ui-anchors.ts selectors.json; then
            echo "::error title=auto-heal left the working tree dirty::ui-anchors.ts or selectors.json still differs from HEAD on the runner after cleanup."
            exit 1
          fi

      # Structural blindness is not a best-effort miss — it is a standing defect
      # in auto-heal itself: anchors are failing and the patcher cannot express a
      # fix for ANY of them, so no future run will resolve it either. The triage
      # step emits an ::error annotation, but annotations do not change a step's
      # outcome, so without this gate the workflow still concluded success in
      # exactly the scenario this PR exists to stop reporting as green.
      #
      # Runs last so the label + drift-PR comment posted during triage land first.
      - name: Fail when auto-heal is structurally blind
        # Gated on the dedicated `blind` output, not on `reason`: a wholesale
        # regression that is ALSO unpatchable emits reason=wholesale-redesign,
        # and keying on reason would miss exactly the worst case — many anchors
        # down and auto-heal powerless to touch any of them.
        if: steps.triage.outputs.blind == 'true'
        run: |
          echo "::error title=auto-heal cannot fix the failing anchors::${{ steps.triage.outputs.blind-anchors }} — these have failed for 2+ runs and none are auto-patchable. This will not resolve on its own; repair the selector by hand or extend the patcher."
          exit 1
